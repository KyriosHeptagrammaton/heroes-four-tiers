# Builds the Windows .exe on every push to main and publishes it as the
# "latest" GitHub Release (download it from the Releases page).
name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  WINEPREFIX: /tmp/wineprefix
  WINEDEBUG: "-all"

jobs:
  export:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install wine + rcedit (embeds the logo into the exe)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine64 >/dev/null
          wget -q https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -O /opt/rcedit.exe
          WINE_BIN=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          echo "wine: $WINE_BIN"
          ls -la "$WINE_BIN" /usr/lib/wine/ 2>&1 | head -5
          mkdir -p "$WINEPREFIX"
          "$WINE_BIN" wineboot --init 2>&1 | tail -5 || true
          # smoke test: rcedit must run under wine
          cp icon.ico /tmp/t.ico
          "$WINE_BIN" /opt/rcedit.exe --help 2>&1 | head -3 || true
          ED=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "export/windows/rcedit = \"/opt/rcedit.exe\"" >> "$ED"
          echo "export/windows/wine = \"$WINE_BIN\"" >> "$ED"
          tail -3 "$ED"

      - name: Import assets
        run: godot --headless --path . --import || true

      - name: Rules parity check (combat engine sanity)
        run: godot --headless --path . -- --test=worldgen_selfcheck

      - name: Export Windows build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/HeroesOfFourSeasons.exe 2>&1 | tee export.log
          if grep -qi "rcedit\|resources modification" export.log; then
            grep -i -A2 "rcedit\|resources modification" export.log | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ls -la build/windows

      - uses: actions/upload-artifact@v4
        with:
          name: HeroesOfFourSeasons-windows
          path: build/windows/HeroesOfFourSeasons.exe
          if-no-files-found: error

  release:
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HeroesOfFourSeasons-windows

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          git_sha="${GITHUB_SHA::7}"
          gh release create latest HeroesOfFourSeasons.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ($git_sha)" \
            --notes "Automatic Windows build of commit $git_sha. Download **HeroesOfFourSeasons.exe** below and run it — no install needed. Saves go in a \`saves\` folder next to the exe." \
            --latest
